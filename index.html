<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher Observation Form</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Observation">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Faruma";src:local("Faruma"),url("fonts/Faruma.woff2") format("woff2"),url("fonts/Faruma.woff") format("woff");font-display:swap}
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#111827;--ink2:#6b7280;--ink3:#9ca3af;--line:#e5e7eb;--line2:#eef0f3;
  --accent:#10b981;--accent-ink:#047857;--accent-soft:#ecfdf5;--blue-soft:#eff6ff;--blue-ink:#2563eb;
  --gold-soft:#fffbeb;--gold-ink:#b45309;--black:#111827;--radius:16px;--shadow:0 1px 3px rgba(17,24,39,.06),0 1px 2px rgba(17,24,39,.04);
  --f-en:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-dv:"Faruma","MV Faseyha",sans-serif;--f-ar:"Amiri","Traditional Arabic",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-en);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.lang-dv{font-family:var(--f-dv);line-height:1.85}
body.lang-ar{font-family:var(--f-ar);line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.num{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.ic{width:20px;height:20px;flex:none;stroke-width:2}
.ic.sm{width:16px;height:16px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line);transition:transform .08s ease,background .15s ease,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 6px 16px rgba(17,24,39,.18)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(16,185,129,.22)}
.btn.block{width:100%}
.btn.lg{min-height:56px;font-size:16px;border-radius:16px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- screens / layout ---------- */
.screen{min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:16px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:12px 10px;padding-top:calc(12px + env(safe-area-inset-top))}
.topbar .iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.topbar .iconbtn:active{background:var(--line2)}
.topbar .tb-title{flex:1;text-align:center;font-size:16px;font-weight:700;line-height:1.1}
.topbar .tb-title small{display:block;font-size:11px;font-weight:500;color:var(--ink2);margin-top:1px}
.content{flex:1;padding:16px;padding-bottom:28px;width:100%;max-width:560px;margin:0 auto}

/* ---------- welcome ---------- */
.welcome{background:
  radial-gradient(130% 60% at 50% -10%, #e9fbf4 0%, rgba(233,251,244,0) 55%),
  radial-gradient(120% 55% at 100% 0%, #eef4ff 0%, rgba(238,244,255,0) 50%), var(--bg);
  align-items:center;justify-content:center;padding:24px}
.wel-card{width:100%;max-width:400px;text-align:center}
.app-badge{width:68px;height:68px;border-radius:20px;background:var(--ink);color:#fff;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 10px 24px rgba(17,24,39,.2)}
.app-badge .ic{width:34px;height:34px}
.wel-card h1{font-size:24px;font-weight:800;margin:0 0 4px;letter-spacing:-.4px}
.wel-card .sub{color:var(--ink2);font-size:14px;margin:0 0 10px}
.wel-card .desc{color:var(--ink3);font-size:14px;margin:0 auto 24px;max-width:300px}
.lang-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.lang-pill{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600;text-align:start;transition:transform .08s,box-shadow .15s}
.lang-pill:active{transform:scale(.99)}
.lang-pill .lp-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.lang-pill[data-l="en"] .lp-ic{background:var(--accent-soft);color:var(--accent-ink)}
.lang-pill[data-l="dv"]{font-family:var(--f-dv)}.lang-pill[data-l="dv"] .lp-ic{background:var(--blue-soft);color:var(--blue-ink)}
.lang-pill[data-l="ar"]{font-family:var(--f-ar)}.lang-pill[data-l="ar"] .lp-ic{background:var(--gold-soft);color:var(--gold-ink)}
.lang-pill .lp-name{flex:1}
.lang-pill .chev{color:var(--ink3)}
.credit{font-size:12px;color:var(--ink3);font-family:var(--f-en);direction:ltr}

/* ---------- home ---------- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 20px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow)}
.hero .hero-ic{width:76px;height:76px;border-radius:22px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 14px}
.hero .hero-ic .ic{width:36px;height:36px}
.hero p{color:var(--ink2);font-size:14px;margin:0;max-width:300px;margin-inline:auto}
.sec-label{font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin:18px 4px 10px}
.obs-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .08s}
.obs-card:active{transform:scale(.99)}
.obs-card .oc-ic{width:44px;height:44px;border-radius:12px;background:var(--line2);color:var(--ink2);display:grid;place-items:center;flex:none}
.obs-card .oc-body{flex:1;min-width:0}
.obs-card .oc-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obs-card .oc-sub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obs-card .oc-right{text-align:end;flex:none}
.obs-card .oc-score{font-weight:800;font-size:15px;direction:ltr}
.obs-card .oc-del{width:36px;height:36px;border-radius:10px;color:var(--ink3);display:grid;place-items:center;flex:none}
.obs-card .oc-del:active{background:var(--line2);color:#dc2626}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-top:3px}
.badge.done{background:var(--accent-soft);color:var(--accent-ink)}
.badge.draft{background:var(--gold-soft);color:var(--gold-ink)}
.empty{text-align:center;color:var(--ink3);font-size:14px;padding:26px 10px;border:1px dashed var(--line);border-radius:16px;background:#fff}
.home-tools{display:flex;gap:10px;margin-top:14px}
.home-tools .btn{flex:1}
.foot-note{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink3);font-size:12px;margin-top:20px;font-family:var(--f-en);direction:ltr}

/* ---------- step indicator ---------- */
.steps{display:flex;align-items:flex-start;position:relative;padding:14px 6px 10px;max-width:560px;margin:0 auto;width:100%}
.steps:before{content:"";position:absolute;top:28px;inset-inline:16%;height:2px;background:var(--line);z-index:0}
.steps .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1}
.steps .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink3)}
.steps .st.active .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.steps .st.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.steps .lb{font-size:10px;color:var(--ink3);text-align:center;line-height:1.1}
.steps .st.active .lb{color:var(--ink);font-weight:700}
.steps .st.done .lb{color:var(--accent-ink)}

/* ---------- step body ---------- */
.step-title{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.step-title .st-ic{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.step-title h2{font-size:19px;font-weight:800;margin:0;letter-spacing:-.3px}
.step-title .st-count{margin-inline-start:auto;font-size:12px;font-weight:700;color:var(--ink2);background:var(--line2);padding:4px 10px;border-radius:20px;direction:ltr}

.field2{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 14px;margin-bottom:10px}
.field2.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field2 .fic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.field2 .fbody{flex:1;min-width:0}
.field2 .flabel{font-size:12px;color:var(--ink2);margin-bottom:1px}
.field2 input,.field2 select{width:100%;border:0;outline:none;background:transparent;font-size:16px;color:var(--ink);padding:2px 0;min-height:26px}
.field2 input::placeholder{color:#c4cad2}
.field2 select{appearance:none;-webkit-appearance:none}

.fb3{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.fb3 .f3h{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin-bottom:9px}
.fb3 .f3h .fic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.fb3 .f3h .opt{margin-inline-start:auto;font-size:11px;font-weight:600;color:var(--ink3)}
.fb3 textarea{width:100%;border:0;outline:none;resize:vertical;min-height:84px;font-size:15px;background:transparent;line-height:1.6}
.fb3 textarea::placeholder{color:#c4cad2}

/* criteria */
.dim-band{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.3px;margin:16px 2px 10px}
.dim-band:first-child{margin-top:2px}
.dim-band .db-ic{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.dim-band .db-n{margin-inline-start:auto;font-size:11px;font-weight:700;color:var(--ink2);text-transform:none}
.crit{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.crit .ct{font-size:14px;line-height:1.4;margin-bottom:12px;color:var(--ink)}
.crit .ct .cx{color:var(--ink3);font-weight:700;font-family:var(--f-en);margin-inline-end:6px}
.rate{display:flex;gap:8px}
.rate button{flex:1;height:46px;max-width:64px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:700;color:var(--ink2);font-family:var(--f-en);transition:transform .08s,background .12s}
.rate button:active{transform:scale(.94)}
.rate button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* review */
.rev-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.result-head{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .rc-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rc-pct{font-size:20px;font-weight:800;direction:ltr}
.result-main{flex:1;min-width:0}
.result-main .rm-score{font-size:26px;font-weight:800;direction:ltr;letter-spacing:-.5px}
.result-main .rm-sub{font-size:12px;color:var(--ink2);direction:ltr}
.result-main .rm-level{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;margin-top:8px}
.brk{margin-top:4px}
.brk-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line2)}
.brk-row .bk-ic{width:30px;height:30px;border-radius:9px;background:var(--line2);color:var(--ink2);display:grid;place-items:center;flex:none}
.brk-row .bk-name{flex:1;font-size:14px}
.brk-row .bk-sc{font-weight:700;font-size:14px;direction:ltr}
.sum-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line2)}
.sum-row:first-child{border-top:0}
.sum-row .sr-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.sum-row .sr-k{font-size:12px;color:var(--ink2)}
.sum-row .sr-v{font-size:15px;font-weight:600}
.sig-pad{border:1.5px dashed var(--line);border-radius:14px;background:#fff;width:100%;aspect-ratio:3/1;touch-action:none;display:block;margin-top:4px}
.sig-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.sig-row .clr{font-size:13px;color:var(--ink2);text-decoration:underline}

/* bottom bar */
.bottombar{position:sticky;bottom:0;z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.bottombar .inner{max-width:560px;margin:0 auto}
.livebar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 13px;margin-bottom:10px}
.livebar .lb-l{display:flex;align-items:baseline;gap:7px;min-width:0}
.livebar .lb-score{font-weight:800;font-size:17px;direction:ltr}
.livebar .lb-pct{font-size:12px;color:var(--ink2);direction:ltr}
.livebar .lb-rated{font-size:11px;color:var(--ink3);direction:ltr}
.livebar .lb-level{background:var(--accent-soft);color:var(--accent-ink);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.navbtns{display:flex;gap:10px}
.navbtns .btn{flex:1}
.navbtns .btn.grow2{flex:2}

/* modals / sheets */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(17,24,39,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.success{text-align:center}
.success .chk{width:88px;height:88px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:4px auto 16px}
.success .chk .ic{width:44px;height:44px;stroke-width:2.5}
.success h3{font-size:20px;font-weight:800;margin:0 0 4px}
.success p{color:var(--ink2);font-size:14px;margin:0 0 20px}
.success .btn{width:100%;margin-bottom:10px}
.sheet .sh-close{position:absolute}
.lang-sheet .ls-opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:600;text-align:start;margin-bottom:8px;border:1px solid var(--line)}
.lang-sheet .ls-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.lang-sheet .ls-opt .lp-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--line2);color:var(--ink2)}
.sheet h3.sh-title{font-size:17px;font-weight:800;margin:0 0 14px;text-align:center}

/* language visibility spans (for any T() usage) */
.l-en,.l-dv,.l-ar{display:none}
body.lang-en .l-en,body.lang-dv .l-dv,body.lang-ar .l-ar{display:inline}

@media(min-width:600px){
  .welcome{padding:40px}
  .hero{border-radius:24px}
}
</style>
</head>

<!-- ========== WELCOME ========== -->
<div id="vWelcome" class="screen welcome">
  <div class="wel-card">
    <div class="app-badge" id="welIcon"></div>
    <h1 id="welTitle">Teacher Observation Form</h1>
    <p class="sub" id="welSub">Islamic University of the Maldives</p>

</div>

<!-- ========== HOME ========== -->
<div id="vHome" class="screen hidden">
  <div class="topbar">
    <button class="iconbtn" id="homeBack" aria-label="Back"></button>
    <div class="tb-title" id="homeTitle">Teacher Observation<small>Islamic University of the Maldives</small></div>

  </div>
  <div class="content" id="homeBody"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>

<!-- ========== FORM WIZARD ========== -->
<div id="vForm" class="screen hidden">
  <div class="topbar">
    <button class="iconbtn" id="formBack" aria-label="Back"></button>

    <button class="iconbtn" id="formLang" aria-label="Language"></button>
  </div>

</div>

<!-- ========== OVERLAYS ========== -->
<div id="successModal" class="overlay hidden"><div class="sheet success" id="successBody"></div></div>

<script>
/* ============ 2. Criteria: [English, Dhivehi, Arabic] ============ */
const DIMS = [
 {t:["LESSON PLANNING","ލެސަން ޕްލޭނިންގ","تخطيط الدرس"], items:[
  ["Delineates appropriate learning objectives.","އެކަށީގެންވާ އުނގެނުމުގެ މަގްސަދު (ތައް) ތަފްސީލުކޮށް ބަޔާންކުރުން","يحدد أهداف التعلم المناسبة."],
  ["Selects appropriate teaching strategies.","އެކަށީގެންވާ އުނގަންނައިދިނުމުގެ ގޮތްތައް ކަނޑައެޅިފައިވުން","يختار استراتيجيات التدريس المناسبة."],
  ["Uses effective learning activities and resources.","އުނގެނުމަށް ފައިދާހުރި ހަރަކާތްތަކާއި ވަސީލަތްތައް ބޭނުންކުރުން","يستخدم أنشطة وموارد تعليمية فعالة."],
  ["Caters to students' diverse needs.","ތަފާތު ފެންވަރުގެ ދަރިވަރުންނަށް، އުނގެނުމަށް މަގުފަހިކުރުން","يلبي احتياجات الطلاب المتنوعة."],
  ["Addresses all elements of the curriculum: knowledge, skills, values, KC, learning intention and success criteria","މަންހަޖުގައި ބަޔާންކޮށްފައިވާ ބައިތައް: މައުލޫމާތު، ހުނަރު، އަގު، ކީ ކޮމްޕީޓަންސީ، އިންޓެންޝަން އަދި ސަކްސަސް ކްރައިޓީރިއާ ހިމެނުން","يتناول جميع عناصر المنهج: المعرفة والمهارات والقيم والكفاءات الأساسية ونية التعلم ومعايير النجاح."],
  ["Assessment strategies and tools stated","ފިލާވަޅު ވަޒަންކުރުމަށް ފިލާވަޅާގުޅޭ ޓޫލްސްތައް ބަޔާންކޮށްފައިވުން","ذكرت استراتيجيات وأدوات التقييم."],
  ["Develops a workable time schedule.","މަސައްކަތް ކުރާނެގޮތުގެ ތާވަލެއް އެކުލަވާލައިފައިވުން","يطور جدولا زمنيا عمليا."]
 ]},
 {t:["LESSON IMPLEMENTATION","ލެސަން އިމްޕްލިމެންޓޭޝަން","تنفيذ الدرس"], items:[
  ["Learning intentions were shared with the students","އުނގެނުމުގެ މަގުސަދު ދަރިވަރުންނާއި ހިއްސާކުރުން","تمت مشاركة نوايا التعلم مع الطلاب."],
  ["Success criteria was discussed with the students","ކާމިޔާބީގެ މިންގަނޑުތަކާ ގުޅޭގޮތުން ދަރިވަރުންނާ މަޝްވަރާ ކުރުން","تمت مناقشة معايير النجاح مع الطلاب."],
  ["Success criteria was displayed","ކާމިޔާބީގެ މިންގަނޑުތައް ފެންނާނެހެން ބެހެއްޓުނު","تم عرض معايير النجاح."],
  ["Learning intentions were displayed","އުނގެނުމުގެ މަގުސަދުތައް ފެންނާނެހެން ބެހެއްޓުނު","تم عرض نوايا التعلم."],
  ["Success criteria was assessed in the lesson","ފިލާވަޅުގައި ކާމިޔާބީގެ މިންގަނޑުތައް ވަޒަންކުރުން","تم تقييم معايير النجاح في الدرس."],
  ["At least two of the key competencies were used","މަދުވެގެން ކީ ކޮމްޕެޓެންސީތަކުގެ ތެރެއިން ދެ ކޮމްޕެޓެންސީއެއް ބޭނުންކޮށްފައިވުން","تم استخدام اثنين على الأقل من الكفاءات الأساسية."],
  ["Key competencies shared and discussed with the students","ކީ ކޮމްޕެޓެންސީތައް ދަރިވަރުންނާ ހިއްސާކޮށް މަޝްވަރާކުރުން","مشاركة ومناقشة الكفاءات الأساسية مع الطلاب."],
  ["Lesson was prepared to achieve at least one shared value","ފިލާވަޅު ތައްޔާރުކޮށްފައިވަނީ މަދުވެގެން އެއް ހިއްސާކުރާ އަގު ހާސިލްކުރުމަށް","تم إعداد الدرس لتحقيق قيمة مشتركة واحدة على الأقل."],
  ["Class Arrangement","ކިލާސް އަތުރާލުން","ترتيب الفصل."],
  ["Set induction: Effective and interesting, linked prior learning to new learning","ފެށުން: ފައިދާހުރި އަދި ޝައުގުވެރި، ކުރީގެ މަޢުލޫމާތާއި އައު މަޢުލޫމާތާއި ގުޅުވުން","التمهيد: فعال ومثير للاهتمام ويربط التعلم السابق بالتعلم الجديد."],
  ["Materials used appropriately","އެހީތައް އެކަށީގެންވާގޮތަށް ބޭނުންކޮށްފައިވުން","استخدام مناسب للأدوات."],
  ["Establishes a supportive learning environment","އެހީތެރިވެދޭ އުނގެނުމުގެ މާހައުލެއް ގާއިމްކުރުން","يوفر بيئة تعليمية داعمة."],
  ["Reinforces good behaviour","ރަނގަޅު ސުލޫކަށް ތަރުހީބުދިނުން","يعزز السلوك الجيد."],
  ["Sustains students' interest","ދަރިވަރުންގެ ޝައުގުވެރިކަން ދެމެހެއްޓުން","يحافظ على اهتمام الطلاب."],
  ["Useful classroom discussions and exercises","ފައިދާހުރި މަޝްވަރާތަކާއި ހަރަކާތްތައް ގެންދިޔުން","مناقشات وتمارين مفيدة في الفصل."],
  ["Encourages Participation","ބައިވެރިވުމަށް ބާރުއެޅުން","يشجع على المشاركة."],
  ["Sets and enforces rules and routines effectively.","ގަވާއިދުތައް ކަނޑައަޅައި އެ ތަންފީޒުކުރުން","يضع القواعد والإجراءات الروتينية ويفرضها بشكل فعال."],
  ["Establishes interaction and rapport","މުޢާމަލާތްކޮށް ރަނގަޅު ގުޅުމެއް ގާއިމުކުރުން","يؤسس التفاعل والألفة."],
  ["Shows care and concern for students.","ދަރިވަރުންނަށް އަޅާލުމާއި އޯގާތެރިކަން ދެއްކުން","يظهر الرعاية والاهتمام للطلاب."],
  ["Uses voice and language appropriately.","އަޑާއި ބަސް އެކަށީގެންވާ ގޮތެއްގައި ބޭނުންކުރުން","يستخدم الصوت واللغة بشكل مناسب."],
  ["Gives proper feedback to students.","ދަރިވަރުންނަށް އެކަށީގެންވާ ފީޑްބެކެއް ދިނުން","يعطي تغذية راجعة مناسبة للطلاب."],
  ["Delivery of the lesson is clear and precise","ފިލާވަޅު ސާފު އަދި ސީދާ ގޮތެއްގައި ހުށައެޅުން","إيصال الدرس واضح ودقيق."],
  ["Uses ICT/media/resource","އައިސީޓީ/މީޑިއާ/ވަސީލަތްތައް ބޭނުންކުރުން","يستخدم تكنولوجيا المعلومات والاتصالات / وسائل الإعلام / الموارد."],
  ["Relates information to prior knowledge","ކުރިން ލިބިފައިވާ ޢިލްމާ އައު މަޢުލޫމާތު ގުޅުވާލުން","يربط المعلومات بالمعرفة السابقة."],
  ["Shared up to date information within the subject area","މައުޟޫއާގުޅޭ ފަހުގެ މައުލޫމާތު ހިއްސާކުރުން","مشاركة معلومات محدثة داخل نطاق الموضوع."],
  ["Encourages students to answer different levels of questions","ދަރިވަރުންނަށް އެކި ފެންވަރުގެ ސުވާލުތަކަށް ޖަވާބު ދިނުމަށް ބާރުއެޅުން","يشجع الطلاب على الإجابة على مستويات مختلفة من الأسئلة."],
  ["Restates questions and answer when necessary","ބޭނުންވާ ވަގުތުތަކުގައި ސުވާލު އަދި ޖަވާބު އަލުން ކިޔައިދިނުން","يعيد صياغة الأسئلة والإجابة عند الضرورة."],
  ["Organizes & monitors individual & group learning","ގްރޫޕް އަދި ވަކި ދަރިވަރުންގެ އުނގެނުން އިންތިޒާމުކޮށް މޮނިޓަރ ކުރުން","ينظم ويراقب التعلم الفردي والجماعي."],
  ["Questions and responds appropriately.","އެކަށީގެންވާ ގޮތެއްގައި ސުވާލުކޮށް އަދި ޖަވާބު ދިނުން","يسأل ويجيب بشكل مناسب."],
  ["Gives clear explanations and instructions.","ފިލާވަޅާއި، އިރުޝާދުތައް ސާފުކޮށް ބުނެދިނުން","يعطي شرحا وإرشادات واضحة."],
  ["Presents with different levels of questions","އެކި ފެންވަރުގެ ސުވާލުތަކާއިއެކު ހުށަހެޅުން","يقدم مستويات مختلفة من الأسئلة."],
  ["Interacts and communicates with students appropriately","އެކަށީގެންވާ ގޮތެއްގައި ދަރިވަރުންނާ މުޢާމަލާތުކުރުން","يتفاعل ويتواصل مع الطلاب بشكل مناسب."],
  ["Differentiated materials and tasks were used","ވަކި ވަކި ދަރިވަރުންގެ ހުރި ތަފާތުބޭނުންތަކާއި، ހުނަރާއި އަދި ފެންވަރަށް ކިޔަވައިދިނުމުގެ އެހީ ބޭނުންކުރުމާއި މަސައްކަތް ހަވާލުކުރުން","تم استخدام مواد ومهام متمايزة."],
  ["Uses probing questions when necessary","ބޭނުންވާ ވަގުތުތަކުގައި ޖަވާބަށް ވާސިލްވުމަށް އެހީތެރިވެދޭ އިތުރު ސުވާލު ބޭނުންކުރުން","يستخدم الأسئلة السابرة عند الضرورة."],
  ["Establishes a collaborative environment with the students","ދަރިވަރުންނާ ގުޅިގެން މަސައްކަތްކުރާ މާހައުލެއް ގާއިމްކުރުން","ينشئ بيئة تعاونية مع الطلاب."],
  ["Maintains a good rapport with the students.","ދަރިވަރުންނާ ރަނގަޅުގުޅުމެއް ދެމެހެއްޓުން","يحافظ على علاقة جيدة مع الطلاب."],
  ["Presents a flexible learning environment","އެކި ހާލަތްތަކުގައި ބަދަލުގެނެވިގެންދާފަދަ އުނގެނުމުގެ މާހައުލެއް އުފެއްދުން","يوفر بيئة تعليمية مرنة."],
  ["Content applied to real world situations","މައުލޫމާތު އާއްމު ދިރިއުޅުމާ ގުޅުވާލެވިފައިވުން","يطبق المحتوى على الواقع العملي في الحياة."],
  ["Relevant and appropriate information delivered","އެކަށީގެންވާ އަދި ގުޅޭ މަޢުލޫމާތު ފޯރުކޮށްދީފައިވުން","قدم المعلومات المناسبة وذات الصلة بالموضوع."],
  ["Presents relevant Examples relates to the content","ފިލާވަޅާ ގުޅޭ މިސާލުތައް ހުށަހެޅުން","يختار أمثلة ذات صلة بالمقرر."],
  ["Misconceptions are identified and addressed","އޮޅުންއަރާ މަފްހޫމްތައް ދެނެގަނެ ސާފުކޮށްދިނުން","تحديد المفاهيم الخاطئة ومعالجتها."],
  ["Challenging and authentic activities are given","ގޮންޖެހުންބޮޑު އަދި އާއްމު ދިރިއުޅުމާ ގުޅުވާލާފައިވާ މަސައްކަތްތައް ދިނުން","يعطي أنشطة متحدية وحقيقية."],
  ["Emphasizes on exploration and creativity in the tasks","މަސައްކަތްތަކުގައި ހޯދުންތަކާއި އުފެއްދުންތެރި ކަމަށް ބާރުއެޅުން","يؤكد على الاستكشاف والإبداع في المهام."],
  /* NOTE: this item is not in the Arabic form; Arabic text below is a translation */
  ["Summarizes all the key points of the lesson","ފިލާވަޅުގެ ހުރިހާ މުހިންމު ނުކުތާތަކެއް ޚުލާސާކުރުން","يلخص جميع النقاط الرئيسية للدرس."]
 ]},
 {t:["EVALUATION","އިވެލުއޭޝަން","التقييم"], items:[
  ["Provide constructive feedback in a timely manner","ބިނާކުރަނިވި ފީޑްބެކް ދޭންޖެހޭ ވަގުތުތަކުގައި ދިނުން","تقديم ملاحظات بناءة في الوقت المناسب."],
  ["Achievement of learning objectives and success criteria was assessed","އުނގެނުމުގެ މަޤްޞަދުތައް ޙާޞިލުކުރުމާއި ކާމިޔާބީގެ މިންގަނޑުތައް ވަޒަންކުރުން","تم تقييم تحقيق أهداف التعلم ومعايير النجاح."],
  ["Students level of understanding were analyzed before during and after instructions","ކިޔަވައިދިނުމުގެ ކުރިންނާއި، ކިޔަވައިދިނުމުގެ ތެރެއިންނާއި އަދި ކިޔަވައި ދިނުމަށްފަހުގައި ދަރިވަރުންގެ އުނގެނުމުގެ ފެންވަރު ދެނެގަތުން.","تم تحليل مستوى فهم الطلاب قبل وأثناء وبعد التدريس."],
  ["The tool used to assess is appropriate and accurate","އެކަށީގެންވާ އަދި ސައްހަ އާލާތްތައް ވަޒަންކުރުމަށް ބޭނުންކުރުން","الأداة المستخدمة للتقييم مناسبة ودقيقة."]

function score(d){
  const v=Object.values(d.r||{}); const sum=v.reduce((a,b)=>a+b,0), n=v.length;
  const max=(n===N||n===0)?N*5:n*5;
  const pct=max?Math.round(sum/max*1000)/10:0;
  return {sum,max,n,pct};
}
const scoreText = s => `${s.sum} / ${s.max}`;
function perfKey(pct,n){
  if(!n) return "";
  if(pct>=90) return "excellent";
  if(pct>=80) return "veryGood";
  if(pct>=70) return "good";
  if(pct>=60) return "satisfactory";
  return "needsImprovement";
}
function dimStats(){

}

const STEPS=[
  {key:"stTeacher",ic:"user"},{key:"stLesson",ic:"calendar"},{key:"stCriteria",ic:"clipboard"},
  {key:"stFeedback",ic:"message"},{key:"stReview",ic:"award"}
];
function openForm(d){
  cur = d ? JSON.parse(JSON.stringify(d)) : {id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), r:{}, assessed:"Assessed", date:new Date().toISOString().slice(0,10), status:"draft"};
  cur.r=cur.r||{};
  step=0; dirty=false; screen("vForm"); renderStep();
}
function stepDone(i){
  if(i===0) return ["student","supervisor","obsNo"].every(f=>(cur[f]||"").trim());
  if(i===1) return ["topic","cls","date"].every(f=>(cur[f]||"").trim());
  if(i===2) return Object.keys(cur.r||{}).length===N;
  if(i===3) return ["strengths","improvements","comments","teacherComments"].some(f=>(cur[f]||"").trim());
  return false;
}
function renderSteps(){
  $("steps").innerHTML=STEPS.map((s,i)=>{
    const cls=i===step?"active":(i<step||stepDone(i))?"done":"";
    const inner=(cls==="done"&&i!==step)?icon("check","sm"):(i+1);
    return `<div class="st ${cls}"><div class="dot">${inner}</div><div class="lb">${m(s.key)}</div></div>`;
  }).join("");
}
function renderStep(){
  syncFromDom();           // keep any current inputs before re-render
  renderSteps();
  $("formBack").innerHTML=icon("chevronL"); $("formLang").innerHTML=icon("globe");
  $("formTitle").textContent=m("homeTitle");
  const body=$("stepBody");
  if(step===0) body.innerHTML=renderTeacher();
  else if(step===1) body.innerHTML=renderLesson();
  else if(step===2) body.innerHTML=renderCriteria();
  else if(step===3) body.innerHTML=renderFeedback();

}

function bindStep(){
  // inputs sync + live updates
  $("stepBody").querySelectorAll("input,select,textarea").forEach(el=>{
    el.addEventListener("input",()=>{ const f=el.id.replace(/^f_/,""); if(f) cur[f]=(el.value||"").trim(); });
  });
  if(step===2){
    const rows=$("stepBody").querySelector(".step-title").parentElement;
    $("stepBody").querySelectorAll(".rate").forEach(r=>{
      r.addEventListener("click",e=>{
        const b=e.target.closest("button[data-v]"); if(!b) return;
        const i=r.dataset.i, v=+b.dataset.v;
        if(cur.r[i]===v) delete cur.r[i]; else cur.r[i]=v;
        r.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.v===cur.r[i]));
        // update this dimension counter + title count + livebar
        const bandN=r.closest(".crit").previousElementSibling; // may not be band; recompute all counts cheaply
        updateCriteriaCounts(); renderBottom();
      });
    });
  }
  if(step===4){ sigInit("sup"); sigLoad("sup"); const c=$("sigClear"); if(c) c.onclick=()=>{ sigClear("sup"); cur.sig_sup=""; }; }
}
function updateCriteriaCounts(){
  const total=Object.keys(cur.r||{}).length;
  const cnt=$("stepBody").querySelector(".st-count"); if(cnt) cnt.textContent=total+" / "+N;
  let idx=0;
  $("stepBody").querySelectorAll(".dim-band").forEach((band,di)=>{
    let rated=0; for(let k=0;k<DIMS[di].items.length;k++){ if(cur.r[idx]!=null) rated++; idx++; }
    const n=band.querySelector(".db-n"); if(n) n.textContent=rated+"/"+DIMS[di].items.length;
  });
}
function syncFromDom(){ $("stepBody") && $("stepBody").querySelectorAll("input,select,textarea").forEach(el=>{ const f=el.id.replace(/^f_/,""); if(f) cur[f]=(el.value||"").trim(); }); }
function saveDraft(){ if(!cur) return; cur.updated=Date.now(); cur.lang=lang; cur.status = allComplete()?"complete":"draft"; try{ store.save(cur); }catch(e){} }
function go(delta){
  syncFromDom();
  if(delta>0 && step<4){ step++; saveDraft(); renderStep(); return; }
  if(delta<0){ if(step===0){ saveDraft(); goHome(); } else { step--; renderStep(); } }
}
function allComplete(){ return REQUIRED.every(f=>(cur[f]||"").trim()) && Object.keys(cur.r||{}).length===N; }
function firstMissingStep(){
  for(const f of ["student","supervisor","obsNo"]) if(!(cur[f]||"").trim()) return {step:0,id:"f_"+f};
  for(const f of ["topic","cls","date"]) if(!(cur[f]||"").trim()) return {step:1,id:"f_"+f};
  if(Object.keys(cur.r||{}).length!==N) return {step:2};
  return null;
}

function generatePDF(){
  syncFromDom();
  const miss=firstMissingStep();
  if(miss){
    const unrated=N-Object.keys(cur.r||{}).length;
    alert(m("incomplete")+(miss.step===2&&unrated>0?"\n\n"+unrated+" "+m("notRated"):""));
    step=miss.step; renderStep();
    if(miss.id) setTimeout(()=>{ const el=$(miss.id); if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.focus&&el.focus(); } },60);
    return;
  }
  cur.updated=Date.now(); cur.lang=lang; cur.status="complete";
  try{ store.save(cur); }catch(e){}
  openReport(true);
  showSuccess();
}

/* ============ 10. Signature pad (preserved) ============ */
function sigClear(k){ const c=$("sig_"+k); if(c) c.getContext("2d").clearRect(0,0,c.width,c.height) }
function sigLoad(k){ const c=$("sig_"+k); if(!c) return; sigClear(k); const d=cur["sig_"+k]; if(!d) return;
  const im=new Image(); im.onload=()=>c.getContext("2d").drawImage(im,0,0); im.src=d }
function sigInit(k){
  const c=$("sig_"+k); if(!c) return; const x=c.getContext("2d"); let down=false;
  const pos=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height] };
  c.onpointerdown=e=>{ e.preventDefault(); down=true; c.setPointerCapture(e.pointerId);
    x.lineWidth=3.5; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#0b1b3a"; x.beginPath(); const p=pos(e); x.moveTo(p[0],p[1]); x.lineTo(p[0]+.1,p[1]); x.stroke() };
  c.onpointermove=e=>{ if(!down) return; const p=pos(e); x.lineTo(p[0],p[1]); x.stroke() };
  const up=()=>{ if(!down) return; down=false; cur["sig_"+k]=c.toDataURL("image/png"); };
  c.onpointerup=up; c.onpointercancel=up;
}

/* ============ 11. Backup / Restore (preserved) ============ */
function allObs(){ try{return JSON.parse(localStorage.getItem(BK)||"[]")}catch(e){return[]} }
function doExport(){
  const data=allObs();
  if(!data.length){ alert(m("noBackup")); return }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="tp-observations-"+new Date().toISOString().slice(0,10)+".json";
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  if(!confirm(m("restoreConfirm"))){ e.target.value=""; return }
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const incoming=JSON.parse(rd.result);
      if(!Array.isArray(incoming)) throw 0;
      const map={}; allObs().forEach(d=>{ if(d&&d.id) map[d.id]=d });
      let n=0;
      incoming.forEach(d=>{ if(d&&d.id && (!map[d.id]||(d.updated||0)>=(map[d.id].updated||0))){ map[d.id]=d; n++ } });
      localStorage.setItem(BK,JSON.stringify(Object.values(map)));
      loadList(); alert(m("restored")+n);
    }catch(err){ alert(m("restoreErr")) }
    e.target.value="";
  };
  rd.readAsText(f);
};

function openReport(doPrint){
  if(!cur) return null;
  const w=window.open("","_blank");
  if(!w){ alert(one("Please allow pop-ups to open the PDF.","PDF ހުޅުވުމަށް ޕޮޕް-އަޕް ހުއްދަކުރައްވާ.","يرجى السماح بالنوافذ المنبثقة لفتح PDF.")); return null; }
  w.document.open(); w.document.write(buildReportDoc()); w.document.close();
  if(doPrint){
    const go2=()=>{ try{ w.focus(); w.print() }catch(e){} };
    const wait=async()=>{ try{ if(w.document.fonts&&w.document.fonts.ready) await w.document.fonts.ready }catch(e){} setTimeout(go2,350) };
    if(w.document.readyState==="complete") wait(); else w.onload=wait;
  }
  return w;
}
async function shareReport(){
  const s=score(cur), pk=perfKey(s.pct,s.n);
  const title=m("shareText");
  const lvl = pk?MSG[pk][lang]:"";
  const text=`${m("shareText")}\n${cur.student||""}\n${s.sum} / ${s.max}${s.n?" ("+s.pct+"%)":""}${lvl?" — "+lvl:""}`.trim();
  const url=location.origin;
  if(navigator.share){ try{ await navigator.share({title,text,url}); }catch(e){} }
  else{ try{ await navigator.clipboard.writeText(text+"\n"+url); alert(one("Summary copied to clipboard.","ޚުލާސާ ކޮޕީކުރެވިއްޖެ.","تم نسخ الملخص.")); }catch(e){ alert(m("shareErr")); } }
}
